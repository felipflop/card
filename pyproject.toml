[project]
name = "card"
version = "0.1.0"
description = "Tooling for the NFC business card: coil generator, fab outputs, art pipeline"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
# kibot imports pcbnew and wx from the system KiCad install, so the venv
# has to be created with --system-site-packages (see `make setup`)
fab = [
    "kibot>=1.9.1",
    "gerbolyze>=3.3.0",
]

[tool.uv]
default-groups = ["fab"]
package = false
